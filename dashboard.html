<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twój Planer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Mój Planer: Grudzień</h1>
        <nav>
            <a href="dashboard.html" class="active"><i class="fa-solid fa-calendar-days"></i> Kalendarz</a>
            <a href="meals.html"><i class="fa-solid fa-utensils"></i> Posiłki</a>
            <a href="finanse.html"><i class="fa-solid fa-wallet"></i> Finanse</a>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profil</a>
            <a href="#" id="logout-btn" style="color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Wyloguj</a>
        </nav>
    </header>

    <main>
        <div class="weekdays">
            <div>Pon</div><div>Wt</div><div>Śr</div><div>Czw</div><div>Pt</div><div>Sob</div><div>Nd</div>
        </div>

        <div id="calendar" class="calendar-grid"></div>
    </main>

    <div id="modal-overlay" class="modal-overlay">

        <div class="modal">
            <span class="close-btn">&times;</span> <h2>Dodaj wpis</h2>
            <p id="selected-date">Dzień: </p>

            <textarea id="task-input" placeholder="Co planujesz? Np. Trening 0 18:00"></textarea>

            <button id="save-btn"> Zapisz</button>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
