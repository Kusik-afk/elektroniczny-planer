<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Elektroniczny Planer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="login-container">

        <div id="login-box" class="card">
            <h2><i class="fa-solid fa-right-to-bracket"></i> Logowanie</h2>
            <input type="text" id="email-login" placeholder="Twój e-mail">
            <input type="password" id="password-login" placeholder="Hasło">
            
            <button id="login-btn" style="width: 100%">Zaloguj się</button>
            
            <p style="margin-top: 15px; font-size: 0.9rem;">
                Nie masz konta? <span id="show-register" class="toggle-link">Zarejestruj się</span>
            </p>
        </div>

        <div id="register-box" class="card hidden">
            <h2><i class="fa-solid fa-user-plus"></i> Rejestracja</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #666;">Dołącz do nas!</p>
            
            <input type="text" id="name-reg" placeholder="Twoje Imię">
            <input type="text" id="email-reg" placeholder="Twój e-mail">
            <input type="password" id="password-reg" placeholder="Hasło (min. 6 znaków)">
            
            <button id="register-btn" style="width: 100%; background-color: var(--success);">Załóż konto</button>
            
            <p style="margin-top: 15px; font-size: 0.9rem;">
                Masz już konto? <span id="show-login" class="toggle-link">Zaloguj się</span>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
