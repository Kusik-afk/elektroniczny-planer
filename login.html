<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Elektroniczny Planer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Witaj ponownie!</h2>

        <form>
            <input type="text" id="email" placeholder="Twój e-mail" required>
            <input type="password" id="password" placeholder="Hasło" required>

            <div style="margin-top: 10px;">
                <button type="button" id="login-btn">Zaloguj się</button>
                <button type="button" id="register-btn" style="background-color: #28a745;">Zarejestruj się</button>
            </div>
        </form>

        <p>Nie masz konta? <a href="index.html">Wróć na stronę główną</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
