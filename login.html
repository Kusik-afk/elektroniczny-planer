<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Elektroniczny Planer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Witaj ponownie!</h2>

        <form>
            <input type="text" placeholder="Twój e-mail" required>
            <input type="password" placeholder="Hasło" required>
            <button id="register-btn" type="button">Zarejestruj się (Test)</button>
        </form>

        <p>Nie masz konta? <a href="index.html">Wróć na stronę główną</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
