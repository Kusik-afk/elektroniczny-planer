<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Elektroniczny Planer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h2>Witaj ponownie!</h2>

        <form>
            <input type="text" id="name-reg" placeholder="Twoje Imię" required>
            <input type="text" id="email" placeholder="Twój e-mail" required>
            <input type="password" id="password" placeholder="Hasło" required>
    
            <div style="margin-top: 10px;">
                <button type="button" id="login-btn">Zaloguj się</button>
                <button type="button" id="register-btn" style="background-color: #28a745;">Zarejestruj się</button>
            </div>
        </form>

        <!-- <p>Nie masz konta? <a href="index.html">Wróć na stronę główną</a></p> -->
    </div>

    <script src="script.js"></script>
</body>
</html>
