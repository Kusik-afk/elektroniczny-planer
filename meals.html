<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer Posiłków</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Planer Posiłków</h1>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-calendar-days"></i> Kalendarz</a>
            <a href="meals.html" class="active"><i class="fa-solid fa-utensils"></i> Posiłki</a>
            <a href="finanse.html"><i class="fa-solid fa-wallet"></i> Finanse</a>
            <a href="profile.html"><i class="fa-solid fa-user"></i> Profil</a>
            <a href="#" id="logout-btn" style="color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Wyloguj</a>
        </nav>
    </header>

    <main>
        <div class="controls">
            <button id="save-meals-btn">Zapisz cały tydzień</button>
            <button id="clear-meals-btn" style="background-color: #ff6b6b;">Wyczyść wszystko</button>
        </div>

        <div class="meals-container">

        </div>

        <section class="shopping-section">
            <h2>Lista zakupów</h2>
            <div class="input-group">
                <input type="text" id="shop-input" placeholder="Co trzeba kupić? np. Masło">
                <button id="add-shop-btn"><i class="fa-solid fa-plus"></i>Dodaj</button>
            </div>

            <ul id="shopping-list"></ul>
        </section>
    </main>

    <script src="meals.js"></script>
</body>
</html>
