<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Twój Profil</h1>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-calendar-days"></i> Kalendarz</a>
            <a href="meals.html"><i class="fa-solid fa-utensils"></i> Posiłki</a>
            <a href="finanse.html"><i class="fa-solid fa-wallet"></i> Finanse</a>
            <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profil</a>
            <a href="index.html" style="color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Wyloguj</a>
        </nav>
    </header>

    <main class="profile-container">
    
        <div class="profile-card">
            <div class="avatar-wrapper" onclick="document.getElementById('file-upload').click()">
                <img src="https://via.placeholder.com/150" id="profile-pic" alt="Avatar">
                
                <div class="upload-overlay">
                    <i class="fa-solid fa-camera"></i>
                </div>

                <input type="file" id="file-upload" accept="image/*" style="display: none;">
            </div>
            <h2 id="display-name" style="margin-top: 15px; color: var(--primary-color);">Twój Nick</h2>
            <p id="display-bio" style="color: var(--text-light); font-style: italic;">Twój opis...</p>
        </div>

        <div class="profile-details">
            
            <section class="stats-section">
                <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-chart-line"></i> Twoja Aktywność</h3>
                
                <div class="stats-grid">
                <div class="stat-box blue">
                    <div class="icon-bg"><i class="fa-solid fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <span id="stat-tasks">0</span>
                        <p>Zadania</p>
                    </div>
                </div>

                <div class="stat-box green">
                    <div class="icon-bg"><i class="fa-solid fa-wallet"></i></div>
                    <div class="stat-info">
                        <span id="stat-balance">0 PLN</span>
                        <p>Saldo</p>
                    </div>
                </div>

                <div class="stat-box orange">
                    <div class="icon-bg"><i class="fa-solid fa-basket-shopping"></i></div>
                    <div class="stat-info">
                        <span id="stat-shopping">0</span>
                        <p>Zakupy</p>
                    </div>
                </div>
            </div>
            </section>

            <section class="edit-section" style="margin-top: 20px;">
                <h3><i class="fa-solid fa-pen-to-square"></i> Edytuj profil</h3>
                
                <label>Twoje Imię / Nick</label>
                <input type="text" id="name-input" placeholder="Jak mamy się do Ciebie zwracać?">
                
                <label>Krótki opis (Bio)</label>
                <textarea id="bio-input" placeholder="Napisz coś o sobie..." style="height: 80px;"></textarea>
                
                <button id="save-profile-btn"><i class="fa-solid fa-floppy-disk"></i> Zapisz zmiany</button>
            </section>

        </div>
    </main>

    <script src="profile.js"></script>
</body>
</html>
